<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prazo para Entrega dos Palpites • Bolão Se Joga na Copa 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{
            --bg-dark:#04142d;
            --bg-blue:#0a2d62;
            --accent:#00d4ff;
            --accent-2:#08f7a1;
            --gold:#ffd700;
            --text:#ffffff;
            --border:rgba(255,255,255,.15);
        }

        body{

            font-family:'Montserrat',sans-serif;

            min-height:100vh;

            color:var(--text);

            display:flex;
            justify-content:center;
            align-items:center;

            padding:30px;

            background:
                radial-gradient(circle at top left, rgba(0,212,255,.18), transparent 25%),
                radial-gradient(circle at bottom right, rgba(8,247,161,.12), transparent 25%),
                linear-gradient(135deg, #03101f 0%, #072654 55%, #04142d 100%);
        }

        body::before{

            content:'';

            position:fixed;

            inset:0;

            background-image:
                linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);

            background-size:40px 40px;

            pointer-events:none;
        }

        .card{

            position:relative;

            z-index:2;

            width:100%;
            max-width:1000px;

            padding:50px;

            text-align:center;

            border-radius:32px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.10),
                    rgba(255,255,255,.05)
                );

            border:1px solid rgba(255,255,255,.12);

            backdrop-filter:blur(20px);

            box-shadow:
                0 25px 60px rgba(0,0,0,.35);
        }

        .logo{

            font-size:4rem;

            margin-bottom:20px;
        }

        h1{

            font-size:clamp(2rem,5vw,3.5rem);

            font-weight:800;

            margin-bottom:15px;
        }

        .subtitulo{

            font-size:1.1rem;

            opacity:.85;

            max-width:700px;

            margin:0 auto 40px;

            line-height:1.7;
        }

        .contador{

            display:grid;

            grid-template-columns:
                repeat(auto-fit,minmax(140px,1fr));

            gap:20px;

            margin-bottom:40px;
        }

        .tempo{

            padding:25px 15px;

            border-radius:24px;

            background:
                rgba(255,255,255,.08);

            border:
                1px solid rgba(255,255,255,.10);

            backdrop-filter:blur(10px);

            transition:.25s ease;
        }

        .tempo:hover{

            transform:translateY(-4px);

            border-color:
                rgba(0,212,255,.35);
        }

        .numero{

            font-size:3rem;

            font-weight:800;

            color:var(--accent);

            margin-bottom:8px;
        }

        .label{

            font-size:.9rem;

            text-transform:uppercase;

            letter-spacing:1px;

            opacity:.75;
        }

        .data-limite{

            font-size:1rem;

            opacity:.85;
        }

        .encerrado{

            color:var(--gold);

            font-size:2rem;

            font-weight:800;

            margin-top:20px;
        }

        @media(max-width:768px){

            .card{

                padding:35px 25px;
            }

            .contador{

                grid-template-columns:
                    repeat(2,1fr);
            }

            .numero{

                font-size:2.4rem;
            }
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="logo">
            ⚽🏆
        </div>

        <h1>
            Contagem Regressiva
        </h1>

        <p class="subtitulo">
            Faltam poucos momentos para o encerramento do prazo de entrega das planilhas de palpites do
            <strong>Bolão Se Joga na Copa 2026</strong>.
            Não deixe para a prorrogação!
        </p>

        <div class="contador">

            <div class="tempo">

                <div class="numero" id="dias">00</div>

                <div class="label">Dias</div>

            </div>

            <div class="tempo">

                <div class="numero" id="horas">00</div>

                <div class="label">Horas</div>

            </div>

            <div class="tempo">

                <div class="numero" id="minutos">00</div>

                <div class="label">Minutos</div>

            </div>

            <div class="tempo">

                <div class="numero" id="segundos">00</div>

                <div class="label">Segundos</div>

            </div>

        </div>

	<div class="data-limite">

	    ⏰ Prazo final:
	    <strong id="prazoFormatado"></strong>

	</div>

        <div id="mensagem"></div>

    </div>

    <script>

	/*
	 * Data limite fixa no Horário de Brasília (UTC-3)
	 * 10/06/2026 23:59:59 BRT
	 */

	const dataLimite =
	    new Date('2026-06-10T23:59:59-03:00');

	document.getElementById('prazoFormatado').textContent =
	    '10 de junho de 2026 às 23h59min59s (Horário de Brasília)';

        function atualizarContador(){

            const agora =
                new Date();

            const diferenca =
                dataLimite - agora;

            if(diferenca <= 0){

                document.getElementById('dias').textContent = '00';
                document.getElementById('horas').textContent = '00';
                document.getElementById('minutos').textContent = '00';
                document.getElementById('segundos').textContent = '00';

                document.getElementById('mensagem').innerHTML =
                    '<div class="encerrado">🚫 Prazo encerrado!</div>';

                clearInterval(intervalo);

                return;
            }

            const dias =
                Math.floor(diferenca / (1000 * 60 * 60 * 24));

            const horas =
                Math.floor((diferenca / (1000 * 60 * 60)) % 24);

            const minutos =
                Math.floor((diferenca / (1000 * 60)) % 60);

            const segundos =
                Math.floor((diferenca / 1000) % 60);

            document.getElementById('dias').textContent =
                String(dias).padStart(2,'0');

            document.getElementById('horas').textContent =
                String(horas).padStart(2,'0');

            document.getElementById('minutos').textContent =
                String(minutos).padStart(2,'0');

            document.getElementById('segundos').textContent =
                String(segundos).padStart(2,'0');
        }

        atualizarContador();

        const intervalo =
            setInterval(atualizarContador,1000);

    </script>

</body>

</html>
