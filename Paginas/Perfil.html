    <!--==================================================

    <style>

        /*==================================================
        RESET
        ==================================================*/

        *{

            margin:0;
            padding:0;
            box-sizing:border-box;

        }

        html{

            scroll-behavior:smooth;

        }

        body{

            font-family:'Montserrat',sans-serif;

            color:#fff;

            background:

                radial-gradient(circle at top left,
                    rgba(0,212,255,.15),
                    transparent 28%),

                radial-gradient(circle at bottom right,
                    rgba(8,247,161,.10),
                    transparent 28%),

                linear-gradient(
                    135deg,
                    #03101f,
                    #06264e,
                    #04142d
                );

            min-height:100vh;

            overflow-x:hidden;

        }

        body::before{

            content:"";

            position:fixed;

            inset:0;

            background-image:

                linear-gradient(
                    rgba(255,255,255,.02) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,.02) 1px,
                    transparent 1px
                );

            background-size:40px 40px;

            pointer-events:none;

            z-index:0;

        }

        /*==================================================
        VARIÁVEIS
        ==================================================*/

        :root{

            --bg-dark:#04142d;

            --bg-card:rgba(255,255,255,.07);

            --bg-card-hover:rgba(255,255,255,.10);

            --border:rgba(255,255,255,.10);

            --accent:#00d4ff;

            --accent2:#08f7a1;

            --gold:#ffd700;

            --silver:#c0c0c0;

            --bronze:#cd7f32;

            --danger:#ff6961;

            --text:#ffffff;

            --text-soft:rgba(255,255,255,.70);

            --shadow:

                0 18px 40px

                rgba(0,0,0,.30);

            --radius:24px;

            --transition:.25s ease;

            --max-width:1450px;

        }

        /*==================================================
        LAYOUT
        ==================================================*/

        .perfil-page{

            position:relative;

            z-index:2;

            max-width:var(--max-width);

            margin:auto;

            padding:24px;

        }

        /*==================================================
        HEADER
        ==================================================*/

        .perfil-header{

            display:flex;

            justify-content:space-between;

            align-items:center;

            gap:24px;

            flex-wrap:wrap;

            margin-bottom:32px;

        }

        .perfil-logo{

            display:flex;

            align-items:center;

            gap:18px;

        }

        .perfil-logo__icon{

            width:68px;

            height:68px;

            border-radius:20px;

            background:

                linear-gradient(

                    135deg,

                    var(--accent),

                    var(--accent2)

                );

            display:flex;

            align-items:center;

            justify-content:center;

            font-size:2rem;

            box-shadow:

                0 10px 25px

                rgba(0,212,255,.35);

        }

        .perfil-logo h1{

            font-size:2rem;

            font-weight:800;

        }

        .perfil-logo p{

            margin-top:4px;

            color:var(--text-soft);

            font-size:.92rem;

        }

        /*==================================================
        MENU
        ==================================================*/

        .perfil-nav{

            display:flex;

            gap:10px;

            flex-wrap:wrap;

            margin-top:20px;

        }

        .perfil-nav a{

            text-decoration:none;

            color:#fff;

            padding:

                12px 18px;

            border-radius:999px;

            background:

                rgba(255,255,255,.06);

            border:

                1px solid var(--border);

            transition:

                var(--transition);

            font-size:.92rem;

            font-weight:600;

            backdrop-filter:blur(10px);

        }

        .perfil-nav a:hover{

            transform:translateY(-2px);

            background:

                linear-gradient(

                    135deg,

                    var(--accent),

                    var(--accent2)

                );

            color:#04142d;

        }

        /*==================================================
        CONTAINER PRINCIPAL
        ==================================================*/

        .perfil-main{

            display:flex;

            flex-direction:column;

            gap:24px;

        }

<!--==================================================
SELETOR DO PARTICIPANTE
===================================================-->

<section class="perfil-selector">

    <div class="perfil-card">

        <div class="perfil-card__title">

            👤 Participante

        </div>

        <div class="perfil-search">

            <span class="perfil-search__icon">

                🔍

            </span>

            <input
                id="busca-input"
                class="perfil-search__input"
                type="text"
                autocomplete="off"
                placeholder="Digite o nome do participante">

            <button
                id="busca-clear"
                class="perfil-search__clear">

                ✕

            </button>

        </div>

        <div
            id="lista-participantes"
            class="perfil-search-list">

            <div
                id="lista-scroll"
                class="perfil-search-scroll">

            </div>

        </div>

    </div>

</section>

</div>
