    <!--==================================================
    CSS
    ===================================================-->

    <style>

        /*==================================================
        RESET
        ==================================================*/

        *{

            margin:0;
            padding:0;
            box-sizing:border-box;

        }

        html{

            scroll-behavior:smooth;

        }

        body{

            font-family:'Montserrat',sans-serif;

            color:#fff;

            background:

                radial-gradient(circle at top left,
                    rgba(0,212,255,.15),
                    transparent 28%),

                radial-gradient(circle at bottom right,
                    rgba(8,247,161,.10),
                    transparent 28%),

                linear-gradient(
                    135deg,
                    #03101f,
                    #06264e,
                    #04142d
                );

            min-height:100vh;

            overflow-x:hidden;

        }

        body::before{

            content:"";

            position:fixed;

            inset:0;

            background-image:

                linear-gradient(
                    rgba(255,255,255,.02) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,.02) 1px,
                    transparent 1px
                );

            background-size:40px 40px;

            pointer-events:none;

            z-index:0;

        }

        /*==================================================
        VARIÁVEIS
        ==================================================*/

        :root{

            --bg-dark:#04142d;

            --bg-card:rgba(255,255,255,.07);

            --bg-card-hover:rgba(255,255,255,.10);

            --border:rgba(255,255,255,.10);

            --accent:#00d4ff;

            --accent2:#08f7a1;

            --gold:#ffd700;

            --silver:#c0c0c0;

            --bronze:#cd7f32;

            --danger:#ff6961;

            --text:#ffffff;

            --text-soft:rgba(255,255,255,.70);

            --shadow:

                0 18px 40px

                rgba(0,0,0,.30);

            --radius:24px;

            --transition:.25s ease;

            --max-width:1450px;

        }

        /*==================================================
        LAYOUT
        ==================================================*/

        .perfil-page{

            position:relative;

            z-index:2;

            max-width:var(--max-width);

            margin:auto;

            padding:24px;

        }

        /*==================================================
        HEADER
        ==================================================*/

        .perfil-header{

            display:flex;

            justify-content:space-between;

            align-items:center;

            gap:24px;

            flex-wrap:wrap;

            margin-bottom:32px;

        }

        .perfil-logo{

            display:flex;

            align-items:center;

            gap:18px;

        }

        .perfil-logo__icon{

            width:68px;

            height:68px;

            border-radius:20px;

            background:

                linear-gradient(

                    135deg,

                    var(--accent),

                    var(--accent2)

                );

            display:flex;

            align-items:center;

            justify-content:center;

            font-size:2rem;

            box-shadow:

                0 10px 25px

                rgba(0,212,255,.35);

        }

        .perfil-logo h1{

            font-size:2rem;

            font-weight:800;

        }

        .perfil-logo p{

            margin-top:4px;

            color:var(--text-soft);

            font-size:.92rem;

        }

        /*==================================================
        MENU
        ==================================================*/

        .perfil-nav{

            display:flex;

            gap:10px;

            flex-wrap:wrap;

            margin-top:20px;

        }

        .perfil-nav a{

            text-decoration:none;

            color:#fff;

            padding:

                12px 18px;

            border-radius:999px;

            background:

                rgba(255,255,255,.06);

            border:

                1px solid var(--border);

            transition:

                var(--transition);

            font-size:.92rem;

            font-weight:600;

            backdrop-filter:blur(10px);

        }

        .perfil-nav a:hover{

            transform:translateY(-2px);

            background:

                linear-gradient(

                    135deg,

                    var(--accent),

                    var(--accent2)

                );

            color:#04142d;

        }

        /*==================================================
        CONTAINER PRINCIPAL
        ==================================================*/

        .perfil-main{

            display:flex;

            flex-direction:column;

            gap:24px;

        }

/*==================================================
FOOTER
==================================================*/

.perfil-footer{

    margin-top:40px;

    padding:24px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    flex-wrap:wrap;

    gap:12px;

    color:var(--text-soft);

    font-size:.85rem;

}

/*==================================================
OVERLAY
==================================================*/

.loading-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    backdrop-filter:blur(6px);

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:9999;

}

.loading-card{

    background:#071a33;

    border-radius:20px;

    padding:32px;

    min-width:260px;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:18px;

    box-shadow:var(--shadow);

}

.loading-text{

    font-weight:600;

}

/*==================================================
TOAST
==================================================*/

.toast{

    position:fixed;

    bottom:24px;

    right:24px;

    background:#062c50;

    border-left:5px solid var(--accent);

    padding:18px 24px;

    border-radius:16px;

    box-shadow:var(--shadow);

    z-index:9998;

}

/*==================================================
MODAL
==================================================*/

.modal-backdrop{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.55);

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:9999;

}

.modal{

    width:min(720px,92vw);

    background:#071b34;

    border-radius:24px;

    overflow:hidden;

}

.modal-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:20px 24px;

    border-bottom:1px solid var(--border);

}

.modal-header button{

    background:none;

    border:none;

    color:white;

    font-size:1.2rem;

    cursor:pointer;

}

.modal-body{

    padding:24px;

}

/*==================================================
EMPTY STATE
==================================================*/

.perfil-empty{

    min-height:180px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:16px;

}

.perfil-empty__icon{

    font-size:3rem;

    opacity:.55;

}

.perfil-empty__title{

    color:var(--text-soft);

}

/*==================================================
UTILITÁRIOS
==================================================*/

.hidden{

    display:none !important;

}

</STYLE>
