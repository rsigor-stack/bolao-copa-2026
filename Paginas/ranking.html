<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ranking - Bolão Copa 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Montserrat',sans-serif;

    background:
    radial-gradient(circle at top left, rgba(0,212,255,.15), transparent 20%),
    radial-gradient(circle at bottom right, rgba(8,247,161,.12), transparent 20%),
    linear-gradient(135deg,#031427,#082f66);

    color:white;

    min-height:100vh;

    padding:40px 20px;

}

.container{

    max-width:1900px;
    margin:auto;

}

.header{

    margin-bottom:30px;

}

.header h1{

    font-size:clamp(2rem,5vw,4rem);
    font-weight:800;

}

.header p{

    margin-top:10px;
    opacity:.8;

}

.table-wrapper{

    overflow:auto;

    border-radius:24px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.10);

    backdrop-filter:blur(12px);

    box-shadow:
    0 20px 60px rgba(0,0,0,.35);

}

table{

    width:100%;
    min-width:1800px;

    border-collapse:collapse;

}

thead{

    background:
    linear-gradient(135deg,#00d4ff,#08f7a1);

    color:#04142d;

}

th{

    padding:16px 12px;

    font-size:.85rem;
    font-weight:800;

    white-space:nowrap;

}

td{

    padding:14px 12px;

    text-align:center;

    border-bottom:
    1px solid rgba(255,255,255,.05);

}

tbody tr:hover{

    background:
    rgba(255,255,255,.05);

}

tbody tr:nth-child(1){

    background:
    rgba(255,215,0,.12);

}

tbody tr:nth-child(2){

    background:
    rgba(192,192,192,.10);

}

tbody tr:nth-child(3){

    background:
    rgba(205,127,50,.10);

}

.apostador{

    text-align:left;
    font-weight:700;

}

.loading{

    padding:60px;
    text-align:center;

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>🏆 Ranking Geral</h1>

        <p>
            Bolão Copa do Mundo 2026
        </p>

    </div>

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>Posição</th>
                    <th>Aposta</th>
                    <th>Apostador</th>
                    <th>Pontos</th>
                    <th>Placar Exato</th>
                    <th>Venc + Pl Venc.</th>
                    <th>Venc + Pl Perd</th>
                    <th>Venc</th>
                    <th>Empate</th>
                    <th>Alg Pl.</th>

                </tr>

            </thead>

            <tbody id="ranking">

                <tr>
                    <td colspan="17" class="loading">
                        Carregando ranking...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

const URL_DBASE =
'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnSbq9S3tbkDcS7iqdMI8OpT-M89Za6i1r-AGjnD3kAgxSZfOUXITplwVzlcxYZ4ywS3HbgBjL108AmsPYszeWDZBuDu_ulamEGbDdLhNN9WT_KaSn7MjnsFj8kqNAAPWeWDeSVpPv9K9kIpxtW77Aybol6pQh-ic_4QM3AsuIeq5ySfNUmPwRpvB_AkZ2dKPv1g2M-mfMEk-qOGbpkXGTydASS4axVzp-StIxvZqDA2Zn88row6U8dnes3Mq0PygHJcAIjtWYzrYnHVcYm1Pz7Ezjhd0w&lib=MoGNgPJGOKUFPzP7D6tyawBQ2SN0MrW_W';

async function carregarRanking(){

    try{

        const response =
        await fetch(URL_DBASE);

        const dados =
        await response.json();

        const tbody =
        document.getElementById('ranking');

        tbody.innerHTML = '';

        dados.forEach(item => {

            const tr =
            document.createElement('tr');

            tr.innerHTML = `

                <td>${item["Posição"] ?? ''}</td>
                <td class="apostador">${item["Apostador"] ?? ''}</td>
                <td>${item["Aposta"] ?? ''}</td>
                <td>${item["Pontos"] ?? ''}</td>

                <td>${item["Placar Exato (12 pt)"] ?? ''}</td>
                <td>${item["Venc + Pl Venc (6 pt)"] ?? ''}</td>
                <td>${item["Venc + Pl Perd (5 pt)"] ?? ''}</td>
                <td>${item["Venc (3 pt)"] ?? ''}</td>
                <td>${item["Empate (5 pt)"] ?? ''}</td>
                <td>${item["Alg Pl. (2 pt)"] ?? ''}</td>
                <td>${item["Zerou Tudo"] ?? ''}</td>
            `;

            tbody.appendChild(tr);

        });

    }
    catch(erro){

        console.error(erro);

        document.getElementById('ranking').innerHTML = `
            <tr>
                <td colspan="17" class="loading">
                    Erro ao carregar dados.
                </td>
            </tr>
        `;

    }

}

carregarRanking();

</script>

</body>
</html>
