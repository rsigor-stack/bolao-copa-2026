<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{

      font-family:'Montserrat',sans-serif;

      background:
      radial-gradient(circle at top left, rgba(0,212,255,.18), transparent 20%),
      radial-gradient(circle at bottom right, rgba(8,247,161,.10), transparent 20%),
      linear-gradient(135deg,#031427,#082f66);

      color:white;

      min-height:100vh;

      padding:40px 20px;

    }

    .container{

      max-width:1900px;
      margin:auto;

    }

    .header{

      margin-bottom:30px;

    }

    .header h1{

      font-size:clamp(2rem,5vw,4rem);

      font-weight:800;

      margin-bottom:12px;

    }

    .header p{

      opacity:.8;

      font-size:1rem;

    }

    .table-wrapper{

      overflow:auto;

      border-radius:28px;

      background:rgba(255,255,255,.08);

      border:1px solid rgba(255,255,255,.10);

      backdrop-filter:blur(14px);

      box-shadow:
      0 20px 60px rgba(0,0,0,.35);

    }

    table{

      width:100%;

      border-collapse:collapse;

      min-width:1800px;

    }

    thead{

      background:
      linear-gradient(135deg,#00d4ff,#08f7a1);

      color:#04142d;

      position:sticky;
      top:0;

      z-index:10;

    }

    th{

      padding:18px 14px;

      text-align:center;

      white-space:nowrap;

      font-size:.85rem;

      font-weight:800;

    }

    td{

      padding:16px 14px;

      text-align:center;

      border-bottom:
      1px solid rgba(255,255,255,.06);

      font-size:.92rem;

    }

    tbody tr{

      transition:.25s ease;

    }

    tbody tr:hover{

      background:
      rgba(255,255,255,.05);

    }

    tbody tr:nth-child(1){

      background:
      rgba(255,215,0,.12);

    }

    tbody tr:nth-child(2){

      background:
      rgba(192,192,192,.10);

    }

    tbody tr:nth-child(3){

      background:
      rgba(205,127,50,.10);

    }

    .posicao{

      font-weight:800;
      font-size:1.1rem;

    }

    .apostador{

      text-align:left;

      font-weight:700;

      min-width:220px;

    }

    .pontos{

      font-weight:800;

      color:#08f7a1;

      font-size:1rem;

    }

    .loading{

      padding:60px;

      text-align:center;

      opacity:.7;

      font-size:1rem;

    }

    .botao-topo{

      position:fixed;

      right:24px;
      bottom:24px;

      width:58px;
      height:58px;

      border-radius:50%;

      display:flex;
      align-items:center;
      justify-content:center;

      text-decoration:none;

      background:
      linear-gradient(135deg,#00d4ff,#08f7a1);

      color:#04142d;

      font-size:1.5rem;
      font-weight:800;

      box-shadow:
      0 10px 25px rgba(0,212,255,.35);

      z-index:999;

      transition:.25s ease;

    }

    .botao-topo:hover{

      transform:
      translateY(-4px)
      scale(1.08);

    }

    @media(max-width:768px){

      body{

        padding:20px 10px;

      }

      .table-wrapper{

        border-radius:20px;

      }

      td{

        padding:14px 10px;

      }

    }

  </style>

</head>

<body id="topo">

<div class="container">

  <div class="header">

    <h1>🏆 Ranking Geral</h1>

  </div>

  <div class="table-wrapper">

    <table>

      <thead>

        <tr>

          <th>Posição</th>
          <th>Aposta (oculto)</th>
          <th>Apostador</th>
          <th>Pontos</th>
          <th>Placar Exato (12 pt)</th>
          <th>Venc + Pl Exato (6 pt)</th>
          <th>Venc + Pl Perd (5 pt)</th>
          <th>Venc (3 pt)</th>
          <th>Empate (5 pt)</th>
          <th>Alg Pl. (2 pt)</th>
          <th>Zerou Tudo</th>
          <!--
          <th>2as de Final (3 pt)</th>
          <th>Oitavas (5 pt)</th>
          <th>Quartas (10 pt)</th>
          <th>Semi (15 pt)</th>
          <th>Final (20 pt)</th>
          <th>Campeão (30 pt)</th>
          <th>Artilheiro (30 pt)</th>
            -->

        </tr>

      </thead>

      <tbody id="ranking-body">

        <tr>

          <td colspan="17" class="loading">

            Carregando ranking...

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>

<a href="#topo" class="botao-topo">
  🏆
</a>

<script>

  /*
  ==========================================
  GOOGLE SHEETS
  ==========================================
  */

  const SHEET_ID =
  '1fdqehi8cSjY4wHg9izoZgsMeamPEh9wbaRo3siRDRBc';

  const GID =
  '941415056';

  const URL =
  `https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnSbq9S3tbkDcS7iqdMI8OpT-M89Za6i1r-AGjnD3kAgxSZfOUXITplwVzlcxYZ4ywS3HbgBjL108AmsPYszeWDZBuDu_ulamEGbDdLhNN9WT_KaSn7MjnsFj8kqNAAPWeWDeSVpPv9K9kIpxtW77Aybol6pQh-ic_4QM3AsuIeq5ySfNUmPwRpvB_AkZ2dKPv1g2M-mfMEk-qOGbpkXGTydASS4axVzp-StIxvZqDA2Zn88row6U8dnes3Mq0PygHJcAIjtWYzrYnHVcYm1Pz7Ezjhd0w&lib=MoGNgPJGOKUFPzP7D6tyawBQ2SN0MrW_W`;
    /*
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`;
    */
  /*
  ==========================================
  FETCH DOS DADOS
  ==========================================
  */

  fetch(URL)

  .then(response => response.text())

  .then(data => {

      const json =
      JSON.parse(data.substr(47).slice(0,-2));

      const rows =
      json.table.rows;

      const tbody =
      document.getElementById('ranking-body');

      tbody.innerHTML = '';

      /*
      ==========================================
      DADOS COMEÇAM NA LINHA 6
      ==========================================
      */

      const dados =
      rows.slice(5);

      dados.forEach((row)=>{

          const c =
          row.c || [];

          const tr =
          document.createElement('tr');

          tr.innerHTML = `

            <td class="posicao">
              ${c[0]?.v ?? ''}
            </td>

            <td class="apostador">
              ${c[1]?.v ?? ''}
            </td>

            <td class="pontos">
              ${c[2]?.v ?? ''}
            </td>

            <td>${c[3]?.v ?? ''}</td>
            <td>${c[4]?.v ?? ''}</td>
            <td>${c[5]?.v ?? ''}</td>
            <td>${c[6]?.v ?? ''}</td>
            <td>${c[7]?.v ?? ''}</td>
            <td>${c[8]?.v ?? ''}</td>
            <td>${c[9]?.v ?? ''}</td>
            <td>${c[10]?.v ?? ''}</td>
            <td>${c[11]?.v ?? ''}</td>
            <td>${c[12]?.v ?? ''}</td>
            <td>${c[13]?.v ?? ''}</td>
            <td>${c[14]?.v ?? ''}</td>
            <td>${c[15]?.v ?? ''}</td>
            <td>${c[16]?.v ?? ''}</td>

          `;

          tbody.appendChild(tr);

      });

  })

  .catch(error => {

      console.error(error);

      document.getElementById('ranking-body')
      .innerHTML = `

        <tr>

          <td colspan="17" class="loading">

            Erro ao carregar dados da planilha.

          </td>

        </tr>

      `;

  });

</script>

</body>
</html>
