<!DOCTYPE html>
<html lang="pt-BR">

<head>
<link rel="stylesheet" href="https://cdn.datatables.net/2.3.8/css/dataTables.dataTables.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ranking - Bolão Copa 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Montserrat',sans-serif;

    background:
    radial-gradient(circle at top left, rgba(0,212,255,.15), transparent 20%),
    radial-gradient(circle at bottom right, rgba(8,247,161,.12), transparent 20%),
    linear-gradient(135deg,#031427,#082f66);

    color:white;

    min-height:100vh;

    padding:40px 20px;

}

.container{

    max-width:1900px;
    margin:auto;

}

.header{

    margin-bottom:30px;

}

.header h1{

    font-size:clamp(2rem,5vw,4rem);
    font-weight:800;

}

.header p{

    margin-top:10px;
    opacity:.8;

}

.table-wrapper{

    overflow:auto;

    border-radius:24px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.10);

    backdrop-filter:blur(12px);

    box-shadow:
    0 20px 60px rgba(0,0,0,.35);

}

table{

    width:100%;
    min-width:1800px;

    border-collapse:collapse;

}

thead{

    background:
    linear-gradient(135deg,#00d4ff,#08f7a1);

    color:#04142d;

}

th{

    padding:16px 12px;

    font-size:.85rem;
    font-weight:800;

    white-space:nowrap;

}

td{

    padding:14px 12px;

    text-align:center;

    border-bottom:
    1px solid rgba(255,255,255,.05);

}

tbody tr:hover{

    background:
    rgba(255,255,255,.05);

}

tbody tr:nth-child(1){

    background:
    rgba(255,215,0,.12);

}

tbody tr:nth-child(2){

    background:
    rgba(192,192,192,.10);

}

tbody tr:nth-child(3){

    background:
    rgba(205,127,50,.10);

}

.apostador{

    text-align:left;
    font-weight:700;

}

.loading{

    padding:60px;
    text-align:center;

}

</style>

</head>

<body>

<div class="container">

    <div class="header">
        <p>
            🏆 Ranking Geral
        </p>

    </div>

    <div class="table-wrapper">

        <table id="data">
            <thead>
                <tr>
                    <th>Posição</th>
                    <th>Aposta</th>
                    <th>Apostador</th>
                    <th>Pontos</th>
                    <th>Placar Exato</th>
                    <th>Venc + Pl Venc.</th>
                    <th>Venc + Pl Perd</th>
                    <th>Venc</th>
                    <th>Empate</th>
                    <th>Alg Pl.</th>
					<th>Zerou Tudo</th>
                </tr>
            </thead>
        </table>
	</div>
</div>

<script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
<script type="text/javascript" src="https://cdn.datatables.net/2.3.8/js/dataTables.js"></script>
<script>
new DataTable('#data', {
	ajax: 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQq0ptJUFK3CAJ7iEFLnE7hCz6oBUwzlD5r4N72LqKmgweOW0gCuA3ElzgrmA1qMqw8EaHvyCDFGoCVbjyGv6qQt-zE_I0wWwsFwqiZ-kYtxPI5WE5oxOzMS28EVH8o4q7Er2OztKPtXVzgeUP76KJfWFa4G23lcdzjPySE8enItGblaBJC5jWcQ9BDF3x2DbSueR7OaWjlzVb4vnKZD67CYv8iDJ941-az1hM2oQRmDHP_OA9v5wVazU2w8OQ5EFyqbAYpM9OgGc0IVzxDmgy_jWda9A&lib=MoGNgPJGOKUFPzP7D6tyawBQ2SN0MrW_W',
	columns: [
		{ data: 'Pos' },
		{ data: 'Aposta' },
		{ data: 'Apostador' },
		{ data: 'Ptos' },
		{ data: 'Pl_Exato' },
		{ data: 'Venc_PlVenc' },
		{ data: 'Venc_PlPerd' },
		{ data: 'Venc' },
		{ data: 'Empate' },
		{ data: 'Alg_Pl' },
		{ data: 'ZerouTudo' }
	]
});
</script>

</body>
</html>
