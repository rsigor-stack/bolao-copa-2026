<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Bolão Se Joga Copa do Mundo 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #04142d;
      --bg-blue: #0a2d62;
      --accent: #00d4ff;
      --accent-2: #08f7a1;
      --gold: #ffd700;
      --text: #ffffff;
      --card: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.15);
    }

    body {
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      color: var(--text);

      background:
        radial-gradient(circle at top left, rgba(0,212,255,.18), transparent 25%),
        radial-gradient(circle at bottom right, rgba(8,247,161,.12), transparent 25%),
        linear-gradient(135deg, #03101f 0%, #072654 55%, #04142d 100%);

      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;

      background-image:
        linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);

      background-size: 40px 40px;

      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 2;

      padding: 32px 24px 16px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;

      max-width: 1400px;
      margin: auto;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 58px;
      height: 58px;

      border-radius: 18px;

      background:
        linear-gradient(135deg, var(--accent), var(--accent-2));

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 1.8rem;

      box-shadow:
        0 10px 25px rgba(0,212,255,.35);
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo p {
      opacity: .75;
      font-size: .95rem;
      margin-top: 4px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;

      background: rgba(255,255,255,.08);
      border: 1px solid var(--border);

      padding: 12px 18px;
      border-radius: 999px;

      backdrop-filter: blur(10px);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-2);

      box-shadow: 0 0 12px var(--accent-2);
    }

    nav {
      position: relative;
      z-index: 2;

      max-width: 1400px;
      margin: 24px auto 0;

      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: white;

      padding: 12px 18px;

      border-radius: 999px;

      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);

      transition: .25s ease;

      font-weight: 600;
      font-size: .95rem;

      backdrop-filter: blur(10px);
    }

    nav a:hover {
      transform: translateY(-2px);

      background:
        linear-gradient(135deg, var(--accent), var(--accent-2));

      color: #04142d;
    }

    .hero {
      position: relative;
      z-index: 2;

      max-width: 1400px;
      margin: 30px auto 24px;
      padding: 0 24px;
    }

    .hero-card {
      position: relative;

      overflow: hidden;

      border-radius: 28px;

      background:
        linear-gradient(135deg,
        rgba(255,255,255,.10),
        rgba(255,255,255,.04));

      border: 1px solid rgba(255,255,255,.12);

      backdrop-filter: blur(18px);

      padding: 48px;

      box-shadow:
        0 25px 60px rgba(0,0,0,.35);
    }

    .hero-card::after {
      content: '';
      position: absolute;

      width: 300px;
      height: 300px;

      border-radius: 50%;

      background:
        radial-gradient(circle, rgba(0,212,255,.35), transparent 70%);

      top: -100px;
      right: -100px;
    }

    .hero h2 {
      position: relative;
      z-index: 2;

      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;

      font-weight: 800;

      margin-bottom: 18px;

      max-width: 800px;
    }

    .hero p {
      position: relative;
      z-index: 2;

      max-width: 700px;

      opacity: .85;

      line-height: 1.7;

      font-size: 1.05rem;
    }

    .stats {
      position: relative;
      z-index: 2;

      max-width: 1400px;
      margin: 0 auto 24px;
      padding: 0 24px;

      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
      gap: 18px;
    }

    .stat-card {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.10);

      border-radius: 24px;

      padding: 24px;

      backdrop-filter: blur(16px);

      transition: .25s ease;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0,212,255,.4);
    }

    .stat-card h3 {
      font-size: .95rem;
      opacity: .7;
      margin-bottom: 10px;
    }

    .stat-card strong {
      font-size: 2rem;
      font-weight: 800;
    }

    .sheet-wrapper {
      position: relative;
      z-index: 2;

      width: calc(100% - 48px);
      max-width: 1400px;

      margin: 0 auto 40px;

      border-radius: 28px;

      overflow: hidden;

      border: 1px solid rgba(255,255,255,.10);

      background: rgba(255,255,255,.08);

      backdrop-filter: blur(20px);

      box-shadow:
        0 25px 60px rgba(0,0,0,.35);
    }

    iframe {
      width: 100%;
      height: 85vh;
      border: none;
      background: white;
    }

    footer {
      position: relative;
      z-index: 2;

      padding: 32px 24px 48px;
      text-align: center;

      opacity: .65;
      font-size: .92rem;
    }

    @media (max-width: 768px) {

      .hero-card {
        padding: 28px;
      }

      .hero h2 {
        line-height: 1.1;
      }

      .logo h1 {
        font-size: 1.4rem;
      }

      iframe {
        height: 78vh;
      }

    }

  </style>

</head>
