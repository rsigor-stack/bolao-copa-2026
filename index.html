<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bolão Copa 2026</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter', sans-serif;
      background:
      linear-gradient(135deg,#041E42,#0A84FF);

      min-height:100vh;
      color:white;
    }

    header{
      padding:24px;
      text-align:center;
    }

    header h1{
      font-size:2.2rem;
      font-weight:700;
    }

    header p{
      opacity:.8;
      margin-top:8px;
    }

    .container{
      width:95%;
      max-width:1400px;

      margin:auto;

      background:white;

      border-radius:20px;

      overflow:hidden;

      box-shadow:
      0 10px 40px rgba(0,0,0,.25);

      margin-bottom:40px;
    }

    iframe{
      width:100%;
      height:85vh;
      border:none;
    }

    footer{
      text-align:center;
      padding:20px;
      opacity:.7;
      font-size:.9rem;
    }

  </style>
</head>

<body>

<header>

  <h1>🏆 Bolão Se Joga na Copa 2026</h1>

  <p>
    Acompanhe jogos, ranking e estatísticas em tempo real
  </p>

</header>

<div class="container">

  <iframe
    src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ_7XaoSAdb3mPu0BCmNKSTwp7Rxwu03fuIANMCxQbg7FZvoXc-qNYY4mIKjuy7b48YatM7VLwl0lA/pubhtml">
  </iframe>

</div>

<footer>
  Desenvolvido para a Copa do Mundo FIFA 2026
</footer>

</body>
</html>
